<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Atlas</title>
  <!-- 引入 FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ========== 全局重置 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ========== 滚动条颜色变量（深色默认） ========== */
    :root {
      --scrollbar-color: #3a3a4a;
      --scrollbar-hover-color: #5a5a6a;
      --scrollbar-track-color: transparent;

      --atlas-title: #ffffff;
      --atlas-shadow: 0 2px 8px rgba(84, 109, 141,0.5);
      --main-bg: rgb(14, 21, 29);
      --gradient-bottom: #0f0f14;
      --main-shadow: 0 0 16px rgba(49, 61, 85, 0.8);
      --text-color: #ccc;
      --footer-color: #7a7a9a;
      --footer-hover-color: #b0b0c0;
      --nav-text-color: #ffffff;
      --nav-hover-color: rgba(43, 59, 80,0.5);
      --atlas-bg: url('bgdarkindex.png');
      --poster-shadow: 0 4px 12px rgba(0,0,0,0.15);
      --poster-hover-shadow: 0 8px 20px rgba(49, 61, 85, 0.8);
      --nav-height: 56px;

      --pagination-hover-color: rgb(84, 109, 141);
      --pagination-active-bg: rgb(84, 109, 141);
      --pagination-active-text: #fff;
    }

    html:has(body.light-mode) {
      --scrollbar-color: #C0C0B3;
      --scrollbar-hover-color: #9CA196;
      --scrollbar-track-color: #f5f5f5;
    }

    body.light-mode {
      --atlas-title: #555;
      --atlas-shadow: 0 2px 8px rgba(255,255,255,0.4);
      --main-bg: #fdfbf7;
      --gradient-bottom: #F0E6D6;
      --main-shadow: 0 0 16px rgba(153, 128, 108, 0.4);
      --text-color: #555;
      --footer-color: #555;
      --footer-hover-color: #000;
      --nav-text-color: #3a3a3c;
      --atlas-bg: url('bglightindex.png');
      --poster-shadow: 0 4px 12px rgba(0,0,0,0.1);
      --poster-hover-shadow: 0 8px 24px rgba(0,0,0,0.25);

      --pagination-hover-color: #CEC3AE;
      --pagination-active-bg: #CEC3AE;
      --pagination-active-text: #fff;
    }

    /* ========== 滚动条样式（混合方案） ========== */
    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    *::-webkit-scrollbar-track {
      background-color: var(--scrollbar-track-color);
    }
    *::-webkit-scrollbar-thumb {
      background: var(--scrollbar-color);
      border-radius: 8px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-hover-color);
    }
    * {
      scrollbar-color: var(--scrollbar-color) var(--scrollbar-track-color);
    }

    /* ========== 自定义字体引入 ========== */
    @font-face {
      font-family: "JNBBHei";
      src: url("game_fonts/JingNanBoBoHei-Bold-2.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    /* ========== 基础样式 ========== */
    body {
      font-family: "JNBBHei", sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #0f0f14;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      transition: color 0.3s ease, background-color 0.3s ease;
      animation: fadeIn 1.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    body.light-mode { background-color: #F0E6D6; }

    /* ========== 导航栏 ========== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      backdrop-filter: none;
      border-bottom: none;
      z-index: 10;
      transition: background-color 0.3s ease, backdrop-filter 0.3s ease;
    }

    body:not(.light-mode) .navbar.nav-scrolled {
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(12px);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ccc;
      text-decoration: none;
      font-size: 20px;
      transition: color 0.3s ease;
      margin-left: 40px;
    }
    .back-btn:hover { color: #fff; }
    .back-btn i { font-size: inherit; }
    .search-area { display: flex; align-items: center; gap: 10px; }

    .search-input {
      width: 0;
      opacity: 0;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 6px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .search-input.active { width: 200px; opacity: 1; pointer-events: auto; }

    .nav-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.3s ease;
      font-size: 20px;
      line-height: 1;
    }
    .nav-icon i { display: block; font-size: inherit; color: inherit; }

    .nav-link-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      text-decoration: none;
    }
    .nav-link-inner i { color: inherit; }

    .nav-icon:hover,
    .nav-icon:hover .nav-link-inner { color: #fff; }

    .theme-toggle {
      background: none;
      border: none;
      border-radius: 0;
      width: auto;
      height: auto;
      padding: 4px;
      font-size: 20px;
      margin-left: 0;
      backdrop-filter: none;
    }

    /* ========== 搜索结果下拉框 ========== */
    .search-wrapper {
      position: relative;
      margin-right: 40px;
    }

    .search-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 200px;
      max-height: 300px;
      overflow-y: auto;
      background: rgba(30, 30, 40, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 20;
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .search-results.active { display: block; }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      cursor: pointer;
      color: #ddd;
      font-size: 14px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .search-result-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .search-result-img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .search-result-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .search-result-text strong {
      color: #fff;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .search-result-year {
      font-size: 12px;
      color: #aaa;
      transition: color 0.3s ease;
    }

    body.light-mode .search-results {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(0, 0, 0, 0.1);
    }
    body.light-mode .search-result-item { color: #333; }
    body.light-mode .search-result-text strong { color: #000; }
    body.light-mode .search-result-year { color: #666; }
    body.light-mode .search-result-item:hover { background: rgba(0, 0, 0, 0.06); }

    /* 浅色模式导航栏覆盖 */
    body.light-mode .navbar {
      background: transparent;
      backdrop-filter: none;
      border-bottom: none;
    }
    body.light-mode .navbar.nav-scrolled {
      background: rgba(240, 233, 221, 0.5);
      backdrop-filter: blur(12px);
    }
    body.light-mode .back-btn { color: #555; }
    body.light-mode .back-btn:hover { color: #000; }
    body.light-mode .nav-icon { color: #555; }
    body.light-mode .nav-icon:hover,
    body.light-mode .nav-icon:hover .nav-link-inner { color: #000; }
    body.light-mode .nav-link-inner { color: inherit; }
    body.light-mode .search-input {
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.15);
      color: #1c1c1e;
    }

    /* ========== 顶图区域 ========== */
    .nav-bg {
      position: relative;
      width: 100%;
      height: calc(100vh + var(--nav-height));
      min-height: 500px;
      background: var(--atlas-bg) center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }
    .nav-bg::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      background: linear-gradient(to top, var(--gradient-bottom), transparent);
      transition: background 0.3s ease;
    }
    .bg-text-container {
      text-align: center;
      z-index: 2;
      position: absolute;
      top: 45%;
      transform: translateY(-50%);
      width: 100%;
    }
    .bg-main-text {
      font-size: 64px;
      font-weight: bold;
      color: var(--atlas-title);
      margin: 0 0 10px 0;
      letter-spacing: 3px;
      text-shadow: 0 0 2px currentColor;
      transition: color 0.3s ease;
    }
    .bg-sub-text {
      font-size: 32px;
      font-weight: bold;
      color: var(--atlas-title);
      margin: 0 0 10px 0;
      letter-spacing: 3px;
      text-shadow: 0 0 2px currentColor;
      transition: color 0.3s ease;
    }

    /* ========== 主内容区域 ========== */
    #main_content {
      background: var(--main-bg);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      padding: 40px;
      border-radius: 6px;
      box-sizing: border-box;
      width: 72%;
      max-width: 1000px;
      margin: -40px auto 0px auto;
      box-shadow: var(--main-shadow);
      position: relative;
      z-index: 5;
    }

    /* ========== 游戏海报网格 ========== */
    .link-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, 180px);
      justify-content: center;
      gap: 30px;
      padding: 0;
      margin: 0;
      list-style: none;
      width: 100%;
    }
    .game-link {
      width: 100%;
      height: 300px;
      box-sizing: border-box;
      position: relative;
      overflow: visible;
      background: transparent;
      border: none;
      box-shadow: none;
      transition: transform 0.3s ease;
    }
    .game-link:hover {
      transform: translateY(-4px);
    }
    .game-home-link {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      background: transparent;
    }
    .game-shelter-display {
      height: 270px;
      width: 100%;
      object-fit: cover;
      object-position: top;
      border-radius: 4px;
      box-shadow: var(--poster-shadow);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
    .game-link:hover .game-shelter-display {
      box-shadow: var(--poster-hover-shadow);
    }
    #abgame {
      padding: 6px 4px 4px 4px;
      text-align: center;
    }
    #abgame p {
      margin: 0;
      line-height: 1.3;
      font-size: 15px;
      font-weight: bold;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.3s ease;
    }

    /* ========== 分页 ========== */
    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
    }
    #prevPage, #nextPage {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-color);
      transition: color 0.3s ease;
    }
    #prevPage:hover:not(:disabled), #nextPage:hover:not(:disabled) {
      color: var(--pagination-hover-color);
    }
    #prevPage:disabled, #nextPage:disabled { opacity: 0.3; cursor: default; }
    .page-number {
      display: inline-block;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
      min-width: 48px;
      text-align: center;
      margin: 4px;
      color: var(--text-color);
      transition: color 0.3s ease, background-color 0.3s ease;
    }
    .page-number.active {
      background-color: var(--pagination-active-bg);
      color: var(--pagination-active-text);
    }
    .page-ellipsis {
      color: var(--text-color);
      padding: 0 4px;
      cursor: default;
      margin-right: 4px;
      transition: color 0.3s ease;
    }

    /* ========== 底部 ========== */
    #footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      color: var(--footer-color);
      background: transparent;
      font-size: 14px;
      transition: color 0.3s ease;
    }
    .foothylink {
      text-decoration: none;
      color: var(--footer-color);
      transition: color 0.3s ease;
    }
    .foothylink:hover { color: var(--footer-hover-color); }

    /* ========== 回到顶部按钮 ========== */
    #go_up {
      position: fixed;
      bottom: 80px;
      right: 90px;
      z-index: 100;
      width: 60px;
      height: 48px;
      border-radius: 8px;
      background-color: rgb(14, 21, 29);
      box-shadow: var(--main-shadow);
      color: var(--text-color);
      border: none;
      cursor: pointer;
      opacity: 0;
      transform: translateY(30px);
      transition: color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #go_up.show { transform: translateY(0); opacity: 1; }
    #go_up:hover { transform: translateY(-6px); color: #fff; }

    /* 浅色模式下分页和 go_up 的颜色覆盖 */
    body.light-mode #prevPage,
    body.light-mode #nextPage,
    body.light-mode .page-number {
      color: #555;
    }
    body.light-mode .page-number.active {
      background-color: var(--pagination-active-bg);
      color: var(--pagination-active-text);
    }
    body.light-mode #prevPage:hover:not(:disabled),
    body.light-mode #nextPage:hover:not(:disabled) {
      color: var(--pagination-hover-color);
    }
    body.light-mode #go_up {
      background-color: #fff;
      color: #555;
    }
    body.light-mode #go_up:hover {
      color: #CEC3AE;
    }

    /* ========== 防止滚动条引起的布局偏移 ========== */
    html {
      scrollbar-gutter: stable;
    }

    /* ========== 响应式设计 ========== */
    @media (max-width: 768px) {
      .bg-main-text { font-size: 36px; }
      .bg-sub-text { font-size: 20px; }
      #main_content {
        width: 90%;
        padding: 20px;
        margin: -20px auto 20px auto;
      }
      #go_up { right: 15px; bottom: 30px; width: 40px; height: 40px; }
      .navbar { padding: 12px 16px; }
      .back-btn { margin-left: 10px; }
      .search-wrapper { margin-right: 10px; }
      .link-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .game-link { height: 210px; }
      .game-shelter-display { height: 165px; }
      .nav-bg {
        height: calc(70vh + var(--nav-height));
        min-height: 400px;
      }
    }
  </style>
</head>

    ];

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('totalnum').textContent = `Numbers ${gameData.length}`;
    });

    const pageSize = 16;
    let currentPage = 1;
    const totalLinks = gameData.length;
    const totalPages = Math.ceil(totalLinks / pageSize);

    function scrollToMainContentTop() {
      const mainContent = document.querySelector('#main_content');
      const rect = mainContent.getBoundingClientRect();
      const viewportHeight = window.innerHeight;
      const dynamicOffset = viewportHeight * 0.16;
      const scrollTarget = window.scrollY + rect.top - dynamicOffset;
      window.scrollTo(0, scrollTarget);
    }

    function getSortedGameData() {
      const sortedData = JSON.parse(JSON.stringify(gameData));
      sortedData.sort((a, b) => b.year - a.year);
      return sortedData;
    }

    function renderPageNumbers() {
      const pageNumbersContainer = document.getElementById('pageNumbers');
      pageNumbersContainer.innerHTML = '';
      const total = totalPages;

      if (total <= 10) {
        for (let i = 1; i <= total; i++) {
          const pageBtn = document.createElement('span');
          pageBtn.textContent = i;
          pageBtn.className = 'page-number';
          if (i === currentPage) pageBtn.classList.add('active');
          pageBtn.addEventListener('click', () => {
            currentPage = i;
            renderPage(currentPage);
            scrollToMainContentTop();
          });
          pageNumbersContainer.appendChild(pageBtn);
        }
        return;
      }

      const left = Math.max(1, currentPage - 4);
      const right = Math.min(total, left + 8);

      const firstBtn = document.createElement('span');
      firstBtn.textContent = 1;
      firstBtn.className = 'page-number';
      if (currentPage === 1) firstBtn.classList.add('active');
      firstBtn.addEventListener('click', () => {
        currentPage = 1;
        renderPage(1);
        scrollToMainContentTop();
      });
      pageNumbersContainer.appendChild(firstBtn);

      if (left > 2) {
        const ellipsis = document.createElement('span');
        ellipsis.textContent = '...';
        ellipsis.className = 'page-ellipsis';
        pageNumbersContainer.appendChild(ellipsis);
      }

      for (let i = left; i <= right; i++) {
        if (i === 1 || i === total) continue;
        const pageBtn = document.createElement('span');
        pageBtn.textContent = i;
        pageBtn.className = 'page-number';
        if (i === currentPage) pageBtn.classList.add('active');
        pageBtn.addEventListener('click', () => {
          currentPage = i;
          renderPage(currentPage);
          scrollToMainContentTop();
        });
        pageNumbersContainer.appendChild(pageBtn);
      }

      if (right < total - 1) {
        const ellipsis = document.createElement('span');
        ellipsis.textContent = '...';
        ellipsis.className = 'page-ellipsis';
        pageNumbersContainer.appendChild(ellipsis);
      }

      const lastBtn = document.createElement('span');
      lastBtn.textContent = total;
      lastBtn.className = 'page-number';
      if (currentPage === total) lastBtn.classList.add('active');
      lastBtn.addEventListener('click', () => {
        currentPage = total;
        renderPage(total);
        scrollToMainContentTop();
      });
      pageNumbersContainer.appendChild(lastBtn);
    }

    function renderPage(pageNum) {
      const gameList = document.getElementById('game-list');
      gameList.innerHTML = '';
      const start = (pageNum - 1) * pageSize;
      const end = Math.min(pageNum * pageSize, totalLinks);
      const sortedData = getSortedGameData();

      for (let i = start; i < end; i++) {
        const game = sortedData[i];
        const gameItem = document.createElement('div');
        gameItem.className = 'game-link';
        gameItem.innerHTML = `
          <a href="${game.linkUrl}" class="game-home-link">
            <img src="${game.imgUrl}" alt="${game.title}" class="game-shelter-display">
            <div id="abgame">
              <p>${game.title}</p>
            </div>
          </a>
        `;
        gameList.appendChild(gameItem);
      }

      document.getElementById('prevPage').disabled = (pageNum === 1);
      document.getElementById('nextPage').disabled = (pageNum === totalPages);
      renderPageNumbers();
    }

    document.getElementById('nextPage').addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        renderPage(currentPage);
        scrollToMainContentTop();
      }
    });
    document.getElementById('prevPage').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage(currentPage);
        scrollToMainContentTop();
      }
    });

    if (totalPages > 1) document.getElementById('pagination').style.display = 'flex';
    renderPage(1);

    const navbar = document.querySelector('.navbar');
    const goup = document.getElementById('go_up');
    const scrollThreshold = 300;

    window.addEventListener('scroll', function() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      if (scrollTop > 30) navbar.classList.add('nav-scrolled');
      else navbar.classList.remove('nav-scrolled');
      if (scrollTop >= scrollThreshold) goup.classList.add('show');
      else goup.classList.remove('show');
    });

    goup.addEventListener('click', function() {
      const step = 50, interval = 6;
      let currentScrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollTimer = setInterval(function() {
        currentScrollTop -= step;
        if (currentScrollTop <= 0) { currentScrollTop = 0; clearInterval(scrollTimer); }
        window.scrollTo(0, currentScrollTop);
      }, interval);
    });

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('i');
    const body = document.body;

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      body.classList.add('light-mode');
      themeIcon.className = 'fas fa-toggle-off fa-fw';
    } else {
      body.classList.remove('light-mode');
      themeIcon.className = 'fas fa-toggle-on fa-fw';
    }

    themeToggle.addEventListener('click', () => {
      if (body.classList.contains('light-mode')) {
        body.classList.remove('light-mode');
        themeIcon.className = 'fas fa-toggle-on fa-fw';
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.add('light-mode');
        themeIcon.className = 'fas fa-toggle-off fa-fw';
        localStorage.setItem('theme', 'light');
      }
    });

    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const searchWrapper = document.querySelector('.search-wrapper');

    searchBtn.addEventListener('click', () => {
      searchInput.classList.toggle('active');
      if (searchInput.classList.contains('active')) {
        searchInput.focus();
        handleSearchInput();
      } else {
        searchResults.classList.remove('active');
      }
    });

    searchInput.addEventListener('input', handleSearchInput);

    searchResults.addEventListener('click', (e) => {
      const item = e.target.closest('.search-result-item');
      if (item) {
        const url = item.dataset.url;
        alert(`跳转到：${url}`);
        searchInput.value = item.querySelector('.search-result-text strong').textContent;
        searchResults.classList.remove('active');
        searchInput.classList.remove('active');
      }
    });

    function handleSearchInput() {
      const keyword = searchInput.value.trim().toLowerCase();
      if (!keyword) {
        searchResults.classList.remove('active');
        searchResults.innerHTML = '';
        return;
      }
      const matches = gameData.filter(game =>
        game.title.toLowerCase().includes(keyword) ||
        game.developer.toLowerCase().includes(keyword)
      );
      if (matches.length > 0) {
        searchResults.innerHTML = matches.map(game => `
          <div class="search-result-item" data-url="${game.linkUrl}">
            <img class="search-result-img" src="${game.imgUrl}" alt="${game.title}">
            <div class="search-result-text">
              <strong>${game.title}</strong>
              <span class="search-result-year">(${game.year})</span>
            </div>
          </div>
        `).join('');
        searchResults.classList.add('active');
      } else {
        searchResults.innerHTML = '<div class="search-result-item" style="cursor:default; opacity:0.6;">未找到匹配游戏</div>';
        searchResults.classList.add('active');
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        searchResults.classList.remove('active');
        searchInput.classList.remove('active');
      }
    });
  </script>
